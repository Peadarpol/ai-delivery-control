artifacts:
  baseline.json:
    pattern_type: keyword_arg
    function_name: disposition
    consumers:
      - file: .agent/skills/universal/senior-architect/scripts/architecture_checks.py
        fields: [baseline, touched_files]
      - file: src/scripts/ai_review.py
        fields: [baseline, touched_files]
  GateContext:
    pattern_type: attribute_access
    variable_name: gate_context
    consumers:
      - file: src/scripts/ai_review.py
        fields: [co_change_warnings, pytest_collect_status, todo_delta, route_decision, verdict, posture, dispositions]
      - file: .agent/skills/universal/senior-architect/scripts/architecture_checks.py
        fields: [arch_violations, adr_domains]
  capability_calibration.json:
    pattern_type: function_call
    function_name: get_calibrated_weight
    module_qualifier: capability_calibration
    consumers:
      - file: src/scripts/ai_review.py
        fields: []
  session.json:
    pattern_type: dict_key_access
    variable_name: sdata
    nested_variable_name: usage
    consumers:
      - file: src/scripts/ai_review.py
        fields: [token_usage]
